<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB Halloween Cauldron</title>
<style>
:root{--bg:#111;--card:#1c1c1c;--fg:#eee;--mute:#9a9a9a;--acc:#ff7a1a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:16px;max-width:1200px;margin:auto}
h1{font-size:20px;margin:8px 0 4px} p.sub{color:var(--mute);margin:0 0 16px}
.muse{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap} .muse img{width:160px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{margin:0;background:var(--card);border-radius:10px;overflow:hidden;border:2px solid transparent}
.card.on{border-color:var(--acc)} .card img{width:100%;display:block;aspect-ratio:1}
figcaption{padding:10px;display:flex;flex-direction:column;gap:6px} figcaption span{color:var(--mute);font-size:13px}
.note{background:#0d0d0d;border:1px solid #333;color:var(--fg);padding:6px;border-radius:6px}
#st{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;padding:6px 10px;border-radius:6px;color:var(--mute)}
</style>

<script>
const st=document.getElementById('st');let t;
function save(){const items={};document.querySelectorAll('.card').forEach(c=>{items[c.dataset.id]={go:c.querySelector('.go').checked,note:c.querySelector('.note').value};c.classList.toggle('on',c.querySelector('.go').checked)});
st.textContent='saving';fetch('picks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})}).then(r=>st.textContent=r.ok?'saved':'save failed').catch(()=>st.textContent='save failed')}
document.addEventListener('input',e=>{if(e.target.matches('.go,.note')){clearTimeout(t);t=setTimeout(save,600)}});
fetch('picks.json').then(r=>r.ok?r.json():{items:{}}).then(d=>{for(const[k,v]of Object.entries(d.items||{})){const c=document.querySelector(`.card[data-id="${k}"]`);if(!c)continue;c.querySelector('.go').checked=v.go;c.querySelector('.note').value=v.note||'';c.classList.toggle('on',v.go)}st.textContent='ready'}).catch(()=>st.textContent='ready');
</script>
